name: Deploy to GitHub Pages

on:
  # 每年 4 月 1 日、10 月 1 日自动更新数据并部署（美团的股票授予主要集中在 10 月和 4 月）
  schedule:
    - cron: "0 8 1 4,10 *"
  # 手动触发（默认更新数据；需要仅部署不重抓时，把 update_data 取消勾选）
  workflow_dispatch:
    inputs:
      update_data:
        description: "更新股价/汇率数据并重新构建"
        type: boolean
        default: true
  # 普通代码提交：仅部署，不重抓数据
  push:
    branches: [master]

permissions:
  contents: write   # 需要写回更新后的数据文件
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---- 1. 更新数据（可选）----
  # schedule / workflow_dispatch(update_data=true) 时执行；普通 push 跳过
  update-data:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.update_data == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取股价 + 汇率
        run: |
          python3 scripts/fetch_data.py

      - name: 构建前端数据文件
        run: |
          python3 scripts/build_js_data.py
          # 展示抓取结果，便于在 Actions 日志确认最新日期
          echo "---- 最新股价 ----"
          tail -3 data/mt_stock.csv
          echo "---- 最新汇率 ----"
          tail -3 data/hkd_rate.csv

      - name: 提交更新后的数据
        run: |
          # 仅在数据有变化时提交，避免产生空 commit
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ src/data/
            git commit -m "chore: 自动更新股价/汇率数据 ($(date +%F))"
            git push
            echo "DATA_UPDATED=true" >> "$GITHUB_ENV"
          else
            echo "数据无变化，跳过提交"
            echo "DATA_UPDATED=false" >> "$GITHUB_ENV"
          fi

  # ---- 2. 构建静态站点 ----
  build:
    runs-on: ubuntu-latest
    # 等待数据更新 job 完成后再拉取最新代码；update-data 被跳过（普通 push）时也继续执行
    if: ${{ !cancelled() }}
    needs: [update-data]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # fetch-depth 0 拉到最新（含 update-data 刚 push 的数据）
        with:
          fetch-depth: 0

      - name: Copy src to site root
        run: |
          mkdir -p _site
          cp -r src/* _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ---- 3. 部署 ----
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
